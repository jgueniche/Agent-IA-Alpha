# =============================================================================
# Orchestration locale / dev Alpha Imagerie.
# Production : memes images, deployees sur infra HDS (cf. infra/deploy + docs/compliance-hds.md).
# Prerequis : copier .env.example -> .env et renseigner ENCRYPTION_KEY + secrets.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_imagerie}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpha} -d ${POSTGRES_DB:-alpha_imagerie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Surcharge l'hote DB/Redis pour le reseau Docker interne.
      DATABASE_URL: postgresql://${POSTGRES_USER:-alpha}:${POSTGRES_PASSWORD:-alpha}@postgres:5432/${POSTGRES_DB:-alpha_imagerie}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${CORE_API_PORT:-4000}:4000"

  back-office:
    build:
      context: .
      dockerfile: apps/back-office/Dockerfile
      args:
        NEXT_PUBLIC_CORE_API_URL: ${NEXT_PUBLIC_CORE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - core-api
    ports:
      - "${BACK_OFFICE_PORT:-3000}:3000"

  voice-gateway:
    build:
      context: .
      dockerfile: apps/voice-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      - core-api
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
